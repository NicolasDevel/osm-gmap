name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # RoutingKit checkout and the compiled contraction hierarchy helper.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/roadpack
          key: roadpack-${{ runner.os }}-${{ hashFiles('src/roadpack/ch/*') }}
      - run: pip install -e '.[test]'
      - run: pytest -q
